name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile checkpoint tool
        run: python -m py_compile skill/organize-xiaohongshu-saves/scripts/xhs_project.py
      - name: Show tool version
        run: python skill/organize-xiaohongshu-saves/scripts/xhs_project.py --version
